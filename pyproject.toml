[project]
name = "mev-platform"
version = "0.1.0"
description = "Simulation-first cross-DEX arbitrage scanner and paper trader (Base, Uniswap V3 + Aerodrome)"
requires-python = ">=3.12"
dependencies = [
    "web3>=7,<8",
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlalchemy>=2",
    "psycopg[binary]>=3",
    "prometheus-client",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mev*"]
