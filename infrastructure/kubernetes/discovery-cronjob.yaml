# Daily pool discovery: refreshes TVL/fees of known pools and adds new ones above the TVL threshold.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mev-discovery
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          imagePullSecrets:
            - name: ocir-secret
          containers:
            - name: discovery
              image: bom.ocir.io/bm9gugcjiuw7/ane:mev
              imagePullPolicy: Always
              command: ["python", "-m", "mev.pools.discovery"]   # allowlist mode; --all is a manual, RPC-heavy run
              envFrom:
                - secretRef: { name: mev-env, optional: true }
              env:
                - { name: PGUSER, valueFrom: { secretKeyRef: { name: mev-postgres-app, key: username } } }
                - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: mev-postgres-app, key: password } } }
                - { name: MEV_DATABASE_URL, value: "postgresql+psycopg://$(PGUSER):$(PGPASSWORD)@mev-postgres-rw:5432/mev" }
                - { name: MEV_METRICS_PORT, value: "0" }
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { memory: 1Gi }
