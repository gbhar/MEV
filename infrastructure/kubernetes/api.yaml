apiVersion: apps/v1
kind: Deployment
metadata:
  name: mev-api
  labels: { app: mev-api }
spec:
  replicas: 1
  selector: { matchLabels: { app: mev-api } }
  template:
    metadata:
      labels: { app: mev-api }
    spec:
      enableServiceLinks: false     # Services named mev-* would inject MEV_*_PORT env vars that Settings would read
      imagePullSecrets:
        - name: ocir-secret          # kubectl create secret docker-registry ocir-secret --docker-server=bom.ocir.io ...
      containers:
        - name: api
          image: bom.ocir.io/bm9gugcjiuw7/ane:mev
          imagePullPolicy: Always
          command: ["python", "-m", "uvicorn", "mev.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
          envFrom:
            - secretRef: { name: mev-env, optional: true }
          env:
            - { name: PGUSER, valueFrom: { secretKeyRef: { name: mev-postgres-app, key: username } } }
            - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: mev-postgres-app, key: password } } }
            - { name: MEV_DATABASE_URL, value: "postgresql+psycopg://$(PGUSER):$(PGPASSWORD)@mev-postgres-rw:5432/mev" }
          ports:
            - { name: http, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mev-api
spec:
  selector: { app: mev-api }
  ports:
    - { name: http, port: 8000, targetPort: http }
