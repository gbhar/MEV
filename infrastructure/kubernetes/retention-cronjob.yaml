# Hourly retention: raw state older than 24 h and losing decisions older than 7 days are deleted; see mev/db/retention.py.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mev-retention
spec:
  schedule: "40 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          imagePullSecrets:
            - name: ocir-secret
          containers:
            - name: retention
              image: bom.ocir.io/bm9gugcjiuw7/ane:mev
              imagePullPolicy: Always
              command: ["python", "-m", "mev.db.retention"]
              envFrom:
                - secretRef: { name: mev-env, optional: true }
              env:
                - { name: PGUSER, valueFrom: { secretKeyRef: { name: mev-postgres-app, key: username } } }
                - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: mev-postgres-app, key: password } } }
                - { name: MEV_DATABASE_URL, value: "postgresql+psycopg://$(PGUSER):$(PGPASSWORD)@mev-postgres-rw:5432/mev" }
                - { name: MEV_METRICS_PORT, value: "0" }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 512Mi }
